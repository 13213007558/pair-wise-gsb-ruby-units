# Short UCUM standard samples used to verify reading, conversion and
# re-emission preserve the meaning of each unit code.
#
# Each entry:
#   code:        strict UCUM input code (also the expected canonical output)
#   base:        the proportional representation in RubyUnits base units
#   convert_to:  target UCUM code
#   value:       numeric value expressed in +code+
#   result:      expected numeric value in +convert_to+
samples:
  - { code: "m",              base: "1 m",                 convert_to: "mm",   value: 1,          result: 1000 }
  - { code: "mm",             base: "1/1000 m",            convert_to: "m",    value: 2500,       result: 2.5 }
  - { code: "kg",             base: "1000 g",              convert_to: "g",    value: 1,          result: 1000 }
  - { code: "um",             base: "1/1000000 m",         convert_to: "nm",   value: 1,          result: 1000 }
  - { code: "m/s",            base: "1 m/s",               convert_to: "mm/s", value: 1,          result: 1000 }
  - { code: "mg/L",           base: "1/1000 g/l",          convert_to: "g/L",  value: 1000,       result: 1 }
  - { code: "kg.m/s2",        base: "1000 g*m/s^2",        convert_to: "N",    value: 1,          result: 1 }
  - { code: "m2",             base: "1 m^2",               convert_to: "cm2",  value: 1,          result: 10000 }
  - { code: "mm3",            base: "1/1000000000 m^3",    convert_to: "uL",   value: 1,          result: 1 }
  - { code: "s-1",            base: "1/s",                 convert_to: "Hz",   value: 60,         result: 60 }
  - { code: "(kg.m)/(s2)",    base: "1000 g*m/s^2",        convert_to: "N",    value: 1,          result: 1 }
  - { code: "Cel{cells}",     base: "1 degC",              convert_to: "[degF]", value: 0,          result: 32 }
  - { code: "[degF]",         base: "1 degF",              convert_to: "Cel",   value: 212,        result: 100 }
  - { code: "%",              base: "1 %",                 convert_to: "1",    value: 50,         result: 0.5 }
  - { code: "100.m",          base: "100 m",               convert_to: "m",    value: 1,          result: 100 }
